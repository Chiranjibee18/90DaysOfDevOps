name: Auto Green

on:
  schedule:
    - cron: "30 1 * * *"    # 7:00 AM IST
    - cron: "30 7 * * *"    # 1:00 PM IST
    - cron: "30 13 * * *"   # 7:00 PM IST

  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Make automatic update
        run: |
          echo "Last automatic update: $(date -u)" > auto-update.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto-update.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automatic daily update"
            git push origin master
          fi
