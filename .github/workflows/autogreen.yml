name: Auto Green

on:
  schedule:
    - cron: "30 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  autogreen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Chiranjibee"
          git config user.email "chiranjibeepanigrahi@gmail.com"

      - name: Create empty commit
        run: |
          git commit --allow-empty -m "chore: daily activity"

      - name: Push commit
        run: |
          git push
